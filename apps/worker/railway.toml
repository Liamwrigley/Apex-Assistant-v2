[build]
builder = "NIXPACKS"
buildCommand = "npm install && npm run build -w @apex-assistant/core && npm run build -w @apex-assistant/db && npm run build -w @apex-assistant/cache && npm run build -w @apex-assistant/worker"

[deploy]
startCommand = "npm run start -w @apex-assistant/worker"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
healthcheckTimeout = 120
